name: Auto Sync Match Data

on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:

jobs:
  run-sync-script:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 1. 取得最新專案程式碼
        uses: actions/checkout@v4

      - name: 2. 設定 Python 環境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 3. 安裝必要套件
        run: |
          pip install pandas requests

      - name: 4. 執行背景同步腳本
        run: |
          python auto_sync.py

      - name: 5. 自動將更新後的 CSV 提交並推送到 GitHub
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add football_betting_db.csv
          git diff --quiet && git diff --staged --quiet || (git commit -m "🤖 Auto-sync: Update match odds and database [skip ci]" && git push)
